<!DOCTYPE html>
<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>

@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap');
:root{--bg:#0f0f1a;--bg2:#1a1a2e;--card:rgba(255,255,255,0.03);--card-b:rgba(255,255,255,0.06);--t1:#fff;--t2:rgba(255,255,255,0.6);--t3:rgba(255,255,255,0.35);--acc:#a855f7;--acc2:#ec4899;--grad:linear-gradient(135deg,#a855f7,#ec4899);--inp:rgba(255,255,255,0.05);--inp-b:rgba(255,255,255,0.08);--btn:linear-gradient(135deg,#a855f7,#ec4899);--sh:0 8px 32px rgba(168,85,247,0.3);--glow:0 0 30px rgba(168,85,247,0.4)}
[data-theme="pink"]{--bg:#fff0f7;--bg2:#ffe4f0;--card:rgba(255,255,255,0.7);--card-b:rgba(236,72,153,0.2);--t1:#4a1942;--t2:rgba(74,25,66,0.7);--t3:rgba(74,25,66,0.4);--acc:#ec4899;--acc2:#f472b6;--grad:linear-gradient(135deg,#ec4899,#f472b6);--inp:rgba(255,255,255,0.8);--inp-b:rgba(236,72,153,0.3);--btn:linear-gradient(135deg,#ec4899,#f472b6);--sh:0 8px 32px rgba(236,72,153,0.3);--glow:0 0 30px rgba(236,72,153,0.4)}
[data-theme="blue"]{--bg:#f0f4ff;--bg2:#e0e8ff;--card:rgba(255,255,255,0.7);--card-b:rgba(99,102,241,0.2);--t1:#1e1b4b;--t2:rgba(30,27,75,0.7);--t3:rgba(30,27,75,0.4);--acc:#6366f1;--acc2:#818cf8;--grad:linear-gradient(135deg,#6366f1,#818cf8);--inp:rgba(255,255,255,0.8);--inp-b:rgba(99,102,241,0.3);--btn:linear-gradient(135deg,#6366f1,#818cf8);--sh:0 8px 32px rgba(99,102,241,0.3);--glow:0 0 30px rgba(99,102,241,0.4)}
[data-theme="warm"]{--bg:#fff8f0;--bg2:#ffe8d6;--card:rgba(255,255,255,0.7);--card-b:rgba(251,146,60,0.2);--t1:#431407;--t2:rgba(67,20,7,0.7);--t3:rgba(67,20,7,0.4);--acc:#fb923c;--acc2:#fdba74;--grad:linear-gradient(135deg,#fb923c,#fdba74);--inp:rgba(255,255,255,0.8);--inp-b:rgba(251,146,60,0.3);--btn:linear-gradient(135deg,#fb923c,#fdba74);--sh:0 8px 32px rgba(251,146,60,0.3);--glow:0 0 30px rgba(251,146,60,0.4)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:'Manrope',-apple-system,sans-serif;height:100%;overflow:hidden;background:#000}
.phone-frame{position:relative;width:100%;max-width:430px;height:100vh;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;transition:background 0.4s}
.app-header{padding:12px 16px 14px;background:linear-gradient(180deg,rgba(168,85,247,0.1) 0%,transparent 100%);display:flex;align-items:center;gap:12px;z-index:10}
.header-avatar{width:44px;height:44px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:var(--sh);overflow:hidden}
.header-info{flex:1}
.header-info h2{color:var(--t1);font-size:17px;font-weight:700}
.header-info p{color:var(--t2);font-size:12px}
.header-actions{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--card-b);color:var(--t1);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:all 0.3s}
.icon-btn:active{transform:scale(0.9) rotate(180deg);background:var(--inp)}
.screen-container{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;overflow-y:auto;padding:0 0 110px 0;opacity:0;pointer-events:none;transition:opacity 0.4s;-webkit-overflow-scrolling:touch}
.screen.active{opacity:1;pointer-events:all}
.tab-bar{position:absolute;bottom:0;left:0;right:0;background:var(--bg2);backdrop-filter:blur(30px);border-top:1px solid var(--card-b);display:flex;justify-content:space-around;padding:10px 0 24px;z-index:100}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;color:var(--t3);cursor:pointer;transition:all 0.3s}
.tab-item.active{color:var(--acc)}
.tab-icon{font-size:24px;margin-bottom:3px;transition:transform 0.3s}
.tab-item.active .tab-icon{transform:scale(1.15)}
.tab-label{font-size:10px;font-weight:600}
.camera-tab .tab-icon{width:58px;height:58px;background:var(--grad);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin-top:-24px;box-shadow:var(--glow);color:#fff}
.chat-screen{display:flex;flex-direction:column;height:100%;background:var(--bg)}
.chat-header{padding:14px 18px;background:var(--card);border-bottom:1px solid var(--card-b);display:flex;align-items:center;gap:12px;backdrop-filter:blur(10px)}
.chat-messages{flex:1;overflow-y:auto;padding:16px;padding-bottom:110px;display:flex;flex-direction:column;gap:10px;background:radial-gradient(ellipse at top,rgba(168,85,247,0.08),transparent 60%)}
.message{max-width:80%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.4;animation:msgAppear 0.3s ease;color:var(--t1)}
@keyframes msgAppear{from{opacity:0;transform:translateY(15px) scale(0.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.message.sent{background:var(--btn);color:#fff;align-self:flex-end;border-bottom-right-radius:5px;box-shadow:var(--sh)}
.message.received{background:var(--card);color:var(--t1);align-self:flex-start;border-bottom-left-radius:5px;border:1px solid var(--card-b)}
.message-time{font-size:10px;opacity:0.5;margin-top:4px}
.chat-input-area{position:absolute;bottom:80px;left:0;right:0;padding:12px 14px;background:var(--bg2);border-top:1px solid var(--card-b);display:flex;gap:10px;align-items:center;z-index:50;backdrop-filter:blur(10px)}
.chat-input{flex:1;background:var(--inp);border:1px solid var(--inp-b);border-radius:24px;padding:12px 16px;color:var(--t1);font-size:14px;outline:none;transition:all 0.3s}
.chat-input:focus{border-color:var(--acc);background:var(--card)}
.chat-input::placeholder{color:var(--t3)}
.send-btn{width:44px;height:44px;border-radius:50%;background:var(--btn);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--sh);transition:all 0.3s}
.send-btn:active{transform:scale(0.88)}
.section-title{color:var(--t1);font-size:24px;font-weight:800;margin:20px 18px 8px}
.section-subtitle{color:var(--t2);font-size:13px;margin:0 18px 20px;font-weight:500}
.card{background:var(--card);border-radius:20px;padding:20px;margin:0 18px 14px;border:1px solid var(--card-b);backdrop-filter:blur(10px);transition:all 0.3s}
.card-gradient{background:linear-gradient(135deg,rgba(168,85,247,0.15),rgba(236,72,153,0.15))}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px;margin-bottom:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 18px}
.quick-action{background:var(--card);border:1px solid var(--card-b);border-radius:18px;padding:20px;text-align:center;cursor:pointer;transition:all 0.3s}
.quick-action:active{transform:scale(0.94)}
.quick-action-icon{font-size:32px;margin-bottom:8px}
.quick-action-label{color:var(--t1);font-size:13px;font-weight:600}
.letter-card{background:linear-gradient(135deg,#fffef5,#fff9e6);border-radius:20px;padding:26px 22px;margin:0 18px 14px;position:relative;box-shadow:0 12px 32px rgba(0,0,0,0.25);border:1px solid rgba(184,160,128,0.2)}
.letter-card::before{content:'';position:absolute;top:-12px;right:22px;font-size:32px;background:var(--bg);padding:4px 10px;border-radius:50%}
.letter-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#a855f7,#ec4899,#a855f7);border-radius:0 0 20px 20px}
.letter-title{font-size:11px;color:#b8a080;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-weight:700}
.letter-content{font-size:15px;color:#5a4a3a;line-height:1.7;font-style:italic;min-height:70px;font-family:'Georgia',serif}
.letter-content.empty{color:#c4b4a0}
.letter-divider{height:1px;background:linear-gradient(90deg,transparent,#d4c4a8,transparent);margin:14px 0}
.letter-footer{margin-top:16px;text-align:right;font-size:13px;color:#b8a080;font-style:italic;font-weight:600;font-family:'Georgia',serif}
.photo-card{background:var(--card);border:1px solid var(--card-b);border-radius:20px;padding:16px;margin:0 18px 14px}
.photo-frame{aspect-ratio:1;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,rgba(168,85,247,0.1),rgba(236,72,153,0.1));display:flex;align-items:center;justify-content:center;border:1px solid var(--card-b)}
.photo-frame img{width:100%;height:100%;object-fit:cover}
.photo-placeholder{font-size:64px;opacity:0.3}
.photo-caption{margin-top:12px;font-size:13px;color:var(--t2);text-align:center}
.stat-box{background:linear-gradient(135deg,rgba(168,85,247,0.15),rgba(236,72,153,0.15));border:1px solid var(--card-b);border-radius:18px;padding:20px 10px;text-align:center}
.stat-val{font-size:28px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:10px;color:var(--t2);font-weight:700;text-transform:uppercase;margin-top:4px}
.mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 18px}
.mood-btn{background:var(--card);border:1px solid var(--card-b);border-radius:18px;padding:16px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--t1);position:relative;transition:all 0.3s}
.mood-btn:active{transform:scale(0.92)}
.mood-btn.active{background:linear-gradient(135deg,rgba(168,85,247,0.3),rgba(236,72,153,0.3));border-color:var(--acc);box-shadow:var(--glow)}
.mood-emoji{font-size:32px}
.mood-label{font-size:11px;font-weight:600;text-align:center}
.mood-delete{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(255,0,0,0.7);border:none;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.3s;z-index:10}
.mood-btn:hover .mood-delete,.mood-btn:active .mood-delete{opacity:1}
.slider-item{background:var(--card);border:1px solid var(--card-b);border-radius:18px;padding:14px 44px 14px 14px;margin:0 18px 10px;position:relative}
.slider-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-right:30px}
.slider-label{color:var(--t1);font-weight:600;font-size:14px}
.slider-value{color:var(--acc);font-weight:800;background:rgba(168,85,247,0.15);padding:4px 10px;border-radius:10px;font-size:13px}
.spicy-slider{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:var(--inp-b);outline:none}
.spicy-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--btn);cursor:pointer;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.spicy-delete{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:rgba(255,0,0,0.7);border:none;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.3s;z-index:10}
.slider-item:hover .spicy-delete{opacity:1}
.btn{background:var(--btn);color:#fff;border:none;border-radius:18px;padding:14px;width:calc(100% - 36px);margin:10px 18px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:var(--sh);transition:all 0.3s}
.btn:active{transform:scale(0.96)}
.btn-small{background:rgba(168,85,247,0.2);border:1px solid rgba(168,85,247,0.3);color:var(--acc);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;width:auto;display:inline-block;margin:0;transition:all 0.3s}
.flo-calendar{background:var(--card);border:1px solid var(--card-b);border-radius:20px;padding:20px;margin:20px 18px 14px}
.flo-cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.flo-cal-title{color:var(--t1);font-weight:700;font-size:16px}
.flo-cal-month{color:var(--t2);font-size:13px}
.flo-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.flo-cal-dow{text-align:center;color:var(--t3);font-size:11px;font-weight:600;padding:6px 0}
.flo-cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:13px;color:var(--t1);cursor:pointer;transition:all 0.3s;background:transparent}
.flo-cal-day:active{transform:scale(0.88)}
.flo-cal-day.today{background:var(--grad);color:#fff;font-weight:700;box-shadow:var(--sh)}
.flo-cal-day.has-event{background:rgba(168,85,247,0.1)}
.flo-cal-dots{display:flex;gap:2px;margin-top:3px;height:6px}
.flo-cal-dot{width:6px;height:6px;border-radius:50%}
.flo-cal-dot.tender{background:#ff69b4}
.flo-cal-dot.passion{background:#ff4500}
.flo-cal-dot.special{background:#9370db}
.flo-cal-dot.experimental{background:#20b2aa}
.flo-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--card-b)}
.flo-legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t2)}
.flo-legend-dot{width:8px;height:8px;border-radius:50%}
.timeline{position:relative;padding:0 18px;margin-bottom:20px}
.timeline::before{content:'';position:absolute;left:24px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--acc),rgba(168,85,247,0.1));border-radius:2px}
.timeline-item{position:relative;background:var(--card);border:1px solid var(--card-b);border-radius:18px;padding:14px;margin-bottom:12px;margin-left:40px;transition:all 0.3s}
.timeline-item::before{content:'';position:absolute;left:-20px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--btn);border:2px solid var(--bg);box-shadow:var(--glow)}
.timeline-date{font-size:11px;color:var(--t2);margin-bottom:4px}
.timeline-title{color:var(--t1);font-weight:700;font-size:14px}
.timeline-delete{position:absolute;top:8px;right:8px;background:rgba(255,0,0,0.7);border:none;border-radius:50%;width:22px;height:22px;color:#fff;cursor:pointer;font-size:12px}
.wishlist-tabs{display:flex;gap:8px;padding:0 18px;margin-bottom:12px}
.wishlist-tab{flex:1;padding:10px;background:var(--card);border:1px solid var(--card-b);border-radius:12px;color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:all 0.3s}
.wishlist-tab.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--sh)}
.wishlist-item{background:var(--card);border:1px solid var(--card-b);border-radius:18px;padding:14px;margin:0 18px 10px;transition:all 0.3s}
.wishlist-item.fulfilled{opacity:0.6}
.wishlist-item.fulfilled .wishlist-text{text-decoration:line-through}
.wishlist-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.wishlist-text{color:var(--t1);font-weight:600;flex:1;font-size:14px}
.wishlist-link{display:flex;align-items:center;gap:6px;padding:8px;background:rgba(168,85,247,0.1);border-radius:8px;margin-bottom:8px;color:var(--acc);font-size:12px;text-decoration:none;word-break:break-all}
.wishlist-actions{display:flex;gap:6px}
.wishlist-btn{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all 0.3s}
.wishlist-btn:active{transform:scale(0.88)}
.wishlist-btn-fulfill{background:linear-gradient(135deg,#4ade80,#22c55e);color:#fff}
.wishlist-btn-delete{background:rgba(255,0,0,0.7);color:#fff}
.wishlist-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(74,222,128,0.2);color:#4ade80;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:700}
.idea-card{background:linear-gradient(135deg,rgba(168,85,247,0.2),rgba(236,72,153,0.2));border:1px solid var(--card-b);border-radius:20px;padding:30px 20px;text-align:center;margin:0 18px 14px;min-height:100px;display:flex;align-items:center;justify-content:center}
.idea-text{color:var(--t1);font-size:16px;font-weight:600;line-height:1.5}
.question-card{background:linear-gradient(135deg,rgba(168,85,247,0.15),rgba(236,72,153,0.15));border:1px solid var(--card-b);border-radius:20px;padding:24px 20px;text-align:center;margin:0 18px 14px}
.question-text{color:var(--t1);font-size:16px;font-weight:600;line-height:1.5;margin-bottom:10px}
.question-category{font-size:11px;color:var(--acc);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
.role-select{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#1a0028,#0f0f1a);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
.role-emoji{font-size:80px;margin-bottom:20px;filter:drop-shadow(0 0 40px rgba(168,85,247,0.6))}
.role-select h1{color:#fff;font-size:32px;font-weight:800;margin-bottom:8px}
.role-select p{color:rgba(255,255,255,0.5);font-size:15px;margin-bottom:32px}
.role-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:18px;cursor:pointer;display:flex;align-items:center;gap:16px;color:#fff;font-size:17px;font-weight:700;width:100%;max-width:340px;margin-bottom:12px;transition:all 0.3s}
.role-btn:active{background:rgba(168,85,247,0.2);transform:scale(0.96)}
.role-btn .emoji{font-size:40px}
.secret-lock{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:100%;background:linear-gradient(135deg,#1a0028,#0f0f1a);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px}
.secret-lock.active{display:flex}
.secret-icon{font-size:72px;margin-bottom:24px}
.secret-title{color:#fff;font-size:24px;font-weight:800;margin-bottom:8px}
.secret-subtitle{color:rgba(255,255,255,0.5);font-size:14px;margin-bottom:32px}
.pin-display{color:#fff;font-size:32px;letter-spacing:12px;margin-bottom:24px;font-family:monospace}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;width:100%}
.pin-key{aspect-ratio:1.3;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;color:#fff;font-size:24px;font-weight:600;cursor:pointer;transition:all 0.3s}
.pin-key:active{background:rgba(168,85,247,0.3);transform:scale(0.92)}
.pin-error{color:#ff0050;font-size:13px;margin-top:16px;min-height:20px}
.secret-screen{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:100%;background:linear-gradient(135deg,#1a0028,#0f0f1a);z-index:300;display:none;flex-direction:column}
.secret-screen.active{display:flex}
.secret-header{padding:44px 18px 14px;background:linear-gradient(180deg,rgba(168,85,247,0.2),transparent);display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(168,85,247,0.2)}
.secret-header h2{color:#fff;font-size:20px;font-weight:800;flex:1}
.secret-tabs{display:flex;background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.06)}
.secret-tab{flex:1;padding:14px;text-align:center;color:rgba(255,255,255,0.5);font-size:13px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;transition:all 0.3s}
.secret-tab.active{color:#a855f7;border-bottom-color:#a855f7}
.secret-content{flex:1;overflow-y:auto;padding:16px}
.secret-panel{display:none}
.secret-panel.active{display:block}
.kama-categories{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.kama-category-card{background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.2);border-radius:18px;padding:20px 14px;text-align:center;cursor:pointer;transition:all 0.3s;position:relative}

// Realtime подписки
db.channel('messages_realtime').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
  if (payload.new && payload.new.sender !== currentRole) {
    if (document.getElementById('screen-chat').classList.contains('active')) { loadMessages(); }
    else { showPushNotification('💬 Новое сообщение', 'У тебя новое сообщение в чате'); }
  }
}).subscribe();

db.channel('app_state_realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'app_state' }, (payload) => {
  console.log('[Realtime] Получено обновление:', payload.new.key);
  if (!payload.new || !payload.new.key) return;
  const key = payload.new.key;
  if (key === 'moods_sonya' || key === 'moods_artem') {
    const moodRole = key.replace('moods_', '');
    if (moodRole !== currentRole) {
      if (document.getElementById('screen-home').classList.contains('active')) loadPartnerMood();
    }
  }
  if (key === 'spicy_sonya' || key === 'spicy_artem') {
    const spicyRole = key.replace('spicy_', '');
    if (spicyRole !== currentRole) {
      localStorage.setItem('spicyValues_' + spicyRole, JSON.stringify(payload.new.value));
      if (document.getElementById('screen-feelings').classList.contains('active')) renderSpicyPartner();
    }
  }
}).subscribe();

window.addEventListener('beforeunload', () => {
  if (currentRole) {
    db.from('user_status').upsert({ user_id: currentRole, last_seen: new Date().toISOString(), is_online: false }).eq('user_id', currentRole).then(() => {}).catch(() => {});
  }
});

window.onload = () => {
  applyTheme(localStorage.getItem('appTheme') || 'dark');
  const savedRole = localStorage.getItem('coupleAppRole');
  if (savedRole) selectRole(savedRole);
  renderMoods();
  renderSpicy();
  loadSavedSpicyValues();
  renderCalendar();
  renderWishlist();
  renderTimeline();
  updateStats();
  generateIdea();
  generateQuestion();
};
</script>
